[project]
name = "langchain-amu"
version = "0.1.3"
description = "LangChain integration for amu-pgvector: a VectorStore and Retriever backed by lineage-gated Analytical Memory Units on PostgreSQL + pgvector."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Venkata Sangaraju" }]
keywords = ["langchain", "postgres", "pgvector", "rls", "agent-memory", "lineage", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "amu-pgvector==0.1.3",
    "langchain-core>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["langchain-tests>=0.3"]

[project.urls]
Homepage = "https://github.com/sangaraju1988/amu-pgvector"
Repository = "https://github.com/sangaraju1988/amu-pgvector"

[tool.uv.sources]
amu-pgvector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_amu"]
