name: Publish to PyPI

# Runs only when a GitHub Release is published -- never automatically
# otherwise. Uses PyPI trusted publishing (OIDC): no API token stored in
# this repo. See submissions/release-checklist.md step 2 for the one-time
# PyPI-side trusted-publisher configuration this depends on, and step 7
# for the manual verification to do after this runs.
#
# Publishes amu-pgvector first, then langchain-amu, since the latter
# depends on a pinned version of the former.
#
# Each job uses its OWN environment name (pypi-amu-pgvector /
# pypi-langchain-amu), not a shared "pypi" one: PyPI's trusted-publisher
# config is keyed on (repo, workflow, environment) -> exactly one PyPI
# project name, so two jobs in the same workflow publishing two different
# projects need two different environment names, or PyPI refuses the
# second one as "already registered for a different project name".

on:
  release:
    types: [published]

jobs:
  publish-amu-pgvector:
    name: amu-pgvector
    runs-on: ubuntu-latest
    environment: pypi-amu-pgvector
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build --package amu-pgvector
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-langchain-amu:
    name: langchain-amu
    needs: publish-amu-pgvector
    runs-on: ubuntu-latest
    environment: pypi-langchain-amu
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build --package langchain-amu
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
